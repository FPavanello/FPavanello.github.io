- title: "Emergency department visits and temperature: Evidence from Mexico"
  authors: "Sarmiento L., Colelli, F.P., Pavanello, F."
  year: 2026
  venue: "Journal of Economic Behavior & Organization"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S016726812600315X"
  abstract: >- 
	We estimate the impact of temperatures on emergency department visits using daily data 
      	from the universe of public hospitals in Mexico from 2008 to 2021. We find that cold 
      	temperatures decrease visits by up to 9.1 percent on the same day, and warm temperatures 
      	increase visits by as much as 3.7 percent. Using distributed lag models, we then show that 
      	cold temperatures can reduce visits for the next 30 days by up to 16 percent. For warm temperatures, 
      	contemporaneous and cumulative effects are similar (limited harvesting). These findings suggest that, 
      	unlike mortality, temperatures affect the demand for emergency services linearly. Leveraging 
      	the granularity of our dataset, we also document significant heterogeneities (e.g., higher sensitivity 
      	for children and teenagers) and provide suggestive evidence about mechanisms, such as ecosystem dynamics 
      	and behavioral changes. Finally, we project that—absent adaptation—temperature-driven 
      	annual emergency department visits might increase by 0.35 percent by midcentury, resulting in an estimated 
      	increase of 8.5 million USD in annual medical expenditures in Mexico.
    links:
      - label: "Ungated version"
        url: "/files/lsfcfp_tmpmorbidity.pdf"
      - label: "Code"
        url: "https://github.com/FPavanello/tmp_er_admissions"
      - label: "Data"
        url: "https://zenodo.org/records/21873500"
      - label: "Tool"
        url: "https://www.luissarmiento.com/temperature-and-emergency-visits/"

- title: "The Impact of Air Conditioning on Residential Electricity Demand across World Countries"
  authors: "De Cian, E., Falchetta, G., Pavanello, F., Romitti, Y., Sue Wing, I."
  year: 2025
  venue: "Journal of Environmental Economics and Management"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0095069625000063"
  figure: "img-jeem-2025.jpg"
  figure_alt: "Marginal effect of air conditioning on household electricity demand, plotted against cooling degree days"
  figure_caption: "Air conditioning raises electricity demand by 36% on average (dashed line), rising towards 60% in the hottest locations."
  abstract: >-
    We provide a first globally-relevant assessment of the electricity consumption
    consequences of households' adaptation to ambient heat through air conditioning (AC).
    We use household survey data from 25 countries within a discrete-continuous choice
    empirical framework to model households' joint air conditioning adoption and
    utilization decisions, and combine the estimated responses with scenarios of
    socioeconomic, demographic, and climatic change to project air conditioning prevalence
    and cooling electricity demand circa mid-century. We find that air conditioning
    ownership increases households' electricity consumption by 36%, on average, but the
    effect is heterogeneous, varying with weather conditions, income and country contexts,
    revealing the importance of behaviors, practices, climate, and technologies. Compared
    to the other drivers of electricity consumption, air conditioning has the leading
    marginal effect, also accounting for a significant share of household budgets. By 2050,
    the overall effect is a net increase in global yearly residential cooling electricity to
    976-1393 TWh, with an additional 670-956 Mt of CO<sub>2</sub> emissions, and associated
    social costs of $124-177 billion. Our findings highlight cooling energy expenditure as an
    emerging indicator of energy poverty as the climate warms, and provide an initial
    quantification of the economic and environmental risks associated with air conditioning
    as an adaptation to climate change.
  links:
    - label: "Working paper (SSRN)"
      url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4604871"
    - label: "Code"
      url: "https://github.com/FPavanello/acglobal"
  media:
