      url: "https://www.washingtonpost.com/opinions/2024/10/05/air-conditioning-climate-change/"
    - label: "il Post"
      url: "https://www.ilpost.it/podcasts/morning/ep-1001-i-due-rubinetti-dellestate-e-le-altre-storie-di-oggi/"
    - label: "il Manifesto"
      url: "https://ilmanifesto.it/condizionatori-co2-e-bollette-alle-stelle"
    - label: "Treccani"
      url: "https://www.treccani.it/magazine/atlante/societa/quanto-pesa-l-aria-condizionata-sul-consumo-di-energia-.html"
