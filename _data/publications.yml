      url: "https://www.huffingtonpost.it/dossier/terra/2025/07/07/news/nel_2023_in_europa_45_miliardi_di_danni_climatici_avanza_la_poverta_da_raffrescamento-19596894/"

- title: "Inequalities in global residential cooling energy use to 2050"
  authors: "Falchetta, G., De Cian, E., Pavanello, F., Sue Wing, I."
  year: 2024
  venue: "Nature Communications"
  url: "https://www.nature.com/articles/s41467-024-52028-8"
  figure:
  figure_alt: "Gridded projections of air conditioning adoption worldwide to 2050"
  figure_caption: "Gridded AC adoption to 2050; up to 4 billion people may still lack cooling."
  abstract: >-
    Intersecting socio-demographic transformations and warming climates portend increasing
    worldwide heat exposures and health sequelae. Cooling adaptation via air conditioning (AC)
    is effective, but energy-intensive and constrained by household-level differences in income
    and adaptive capacity. Using statistical models trained on a large multi-country household
    survey dataset (n = 673,215), we project AC adoption and energy use to mid-century at fine
    spatial resolution worldwide. Globally, the share of households with residential AC could
    grow from 27% to 41% (range of scenarios assessed: 33-48%), implying up to a doubling of
    residential cooling electricity consumption, from 1220 to 1940 (scenarios range: 1590-2377)
    terawatt-hours yr.-1, emitting between 590 and 1,365 million tons of carbon dioxide
    equivalent (MtCO2e). AC access and utilization will remain highly unequal within and across
    countries and income groups, with significant regressive impacts. Up to 4 billion people may
    lack air-conditioning in 2050. Our global gridded projections facilitate incorporation of
    AC's vulnerability, health, and decarbonization effects into integrated assessments of
    climate change.
  links:
    - label: "Working paper"
      url: "https://www.researchsquare.com/article/rs-3441530/v1"
    - label: "Slides"
      url: "/files/acglobalgrid_slides.pdf"
    - label: "Code"
      url: "https://github.com/giacfalk/ggACene"
    - label: "Gridded data"
      url: "https://zenodo.org/records/12697821"
  media:
