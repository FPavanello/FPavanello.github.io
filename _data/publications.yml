- title: "Households' adaptation in a warming climate: Air conditioning and thermal insulation choices"
  authors: "De Cian, E., Pavanello, F., Randazzo, T., Mistry, M.N., Davide, M."
  year: 2019
  venue: "Environmental Science & Policy"
  url: "/files/De_Cian_et_al_2019.pdf"
  figure:
  figure_alt: "Adoption response to cumulative hot and cold days across eight OECD countries"
  figure_caption: "Adoption response to cumulative hot and cold days across eight OECD countries."
  abstract: >-
    Adjustments in the final use of energy are a critical margin of adaptation for maintaining
    indoor thermal comfort. This paper explores how households have been adopting air conditioning
    and thermal insulation to cope with different climatic conditions, and how climatic factors
    interact with socio-economic, demographic, and household characteristics across eight OECD
    countries. Changes in the cumulative number of hot and cold days over the year, urbanization,
    demographics and household characteristics, including attitudes towards energy efficiency,
    strongly affect those two margins of adaptation, along with income. If the historically-observed
    adaptation behaviour is maintained also under future socio-economic pathways and climate
    scenarios, the impact of global warming and income on air conditioning adoption will be
    reinforced by urbanization trends, which on the contrary will make it more difficult to improve
    building thermal insulation.
  links:
    - label: "Working paper"
      url: "/files/De_Cian_et_al_WP.pdf"
    - label: "Interview (SBS.au)"
      url: "https://www.sbs.com.au/language/italian/audio/l-impatto-dei-condizionatori-sul-cambiamento-climatico"
  media:
