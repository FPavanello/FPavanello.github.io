{% comment %}
  Light/dark switch. The preference is stored in localStorage and applied in
  head.html before first paint, so there is no flash on reload. With no stored
  preference the page follows the operating system setting.
{% endcomment %}

<button class="theme-toggle" type="button" data-theme-toggle aria-live="polite">
  Switch theme
</button>

<script>
  (function () {
    var btn = document.querySelector("[data-theme-toggle]");
    if (!btn) return;

    var root = document.documentElement;

    // Light is the default; the OS preference is deliberately not consulted,
    // so an unset attribute always means light.
    function current() {
      return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
    }

    function label() {
      btn.textContent = current() === "dark" ? "Light theme" : "Dark theme";
    }

    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      label();
    });

    label();
  })();
</script>
